<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Draufsicht: durchgehende gerade Vorderkante, Wand endet bei 120 cm, Rücksprung um 20 cm, Schubladenblock, Stützen und Hocker in der Barzone, Regalaufsatz an der Wand">
<defs>
<marker id="a2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M6 0 0 3 6 6z" fill="#3d4b4c"/></marker>
<pattern id="wh2" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e8e4d5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b8b4a5" stroke-width="1"/></pattern>
</defs>
<!-- Wand hinter Sektion 1 (endet bei x=520) -->
<rect x="100" y="52" width="420" height="20" fill="url(#wh2)" stroke="#9aa4a2"/>
<text x="310" y="46" font-family="Arial,sans-serif" font-size="12" fill="#5a696d" text-anchor="middle">Wand endet hier ↴</text>
<line x1="520" y1="48" x2="520" y2="72" stroke="#b7472a" stroke-width="2"/>
<!-- Sektion 1 Arbeitsplatte 1200x500 -->
<rect x="100" y="72" width="420" height="175" fill="#a96f3e" stroke="#71421f" stroke-width="1.5"/>
<!-- Sektion 2 Arbeitsplatte 500x700, Rücksprung +20cm nach oben -->
<rect x="520" y="2" width="175" height="245" fill="#a96f3e" stroke="#71421f" stroke-width="1.5"/>
<!-- Regalaufsatz (180mm tief, an Wandkante Sektion 1, auf Platte) -->
<rect x="100" y="72" width="420" height="63" fill="#c9b28a" stroke="#71421f" stroke-width="1" stroke-dasharray="4 2"/>
<text x="310" y="110" font-family="Arial,sans-serif" font-size="11" fill="#71421f" text-anchor="middle">Regalaufsatz 180 mm tief</text>
<!-- Schubladenblock (unter Platte Sektion 1, gestrichelt) -->
<rect x="100" y="135" width="420" height="112" fill="none" stroke="#71421f" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="310" y1="135" x2="310" y2="247" stroke="#71421f" stroke-width="1" stroke-dasharray="5 3"/>
<text x="205" y="200" font-family="Arial,sans-serif" font-size="11" fill="#5a696d" text-anchor="middle">Schubladen 600</text>
<text x="415" y="200" font-family="Arial,sans-serif" font-size="11" fill="#5a696d" text-anchor="middle">Schubladen 600</text>
<!-- Stützen (2 in Barzone, eingezeichnet als Quadrate 50x50) -->
<g fill="#6b7d80" stroke="#344244" stroke-width="1">
<rect x="535" y="180" width="14" height="14"/>
<rect x="660" y="180" width="14" height="14"/>
<rect x="660" y="20" width="14" height="14"/>
</g>
<!-- Hocker -->
<circle cx="612" cy="290" r="40" fill="none" stroke="#5a696d" stroke-width="1.2"/>
<circle cx="612" cy="290" r="34" fill="#829296" stroke="#344244" stroke-width="1"/>
<text x="612" y="294" font-family="Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle">Hocker</text>
<!-- Beschriftungen -->
<text x="310" y="265" font-family="Arial,sans-serif" font-size="13" fill="#172126" text-anchor="middle">Arbeitsbereich 1200 × 500</text>
<text x="607" y="130" font-family="Arial,sans-serif" font-size="13" fill="#172126" text-anchor="middle" transform="rotate(-90 607 130)">Bar 400–500 × 700</text>
<!-- Rücksprung-Pfeil -->
<g stroke="#b7472a" fill="none" stroke-width="1.5" marker-end="url(#a2)">
<line x1="540" y1="60" x2="540" y2="10"/>
</g>
<text x="545" y="35" font-family="Arial,sans-serif" font-size="11" fill="#b7472a">+200</text>
<!-- Auszugsrichtung vorne -->
<g stroke="#b7472a" stroke-width="3" marker-end="url(#a2)">
<line x1="450" y1="320" x2="450" y2="360"/>
</g>
<!-- Massketten -->
<g stroke="#3d4b4c" fill="none" stroke-width="1" marker-start="url(#a2)" marker-end="url(#a2)">
<line x1="100" y1="290" x2="520" y2="290"/>
<line x1="520" y1="290" x2="695" y2="290"/>
<line x1="100" y1="460" x2="695" y2="460"/>
<line x1="75" y1="72" x2="75" y2="247"/>
<line x1="730" y1="2" x2="730" y2="247"/>
<line x1="755" y1="2" x2="755" y2="72"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#172126">
<text x="310" y="285" text-anchor="middle">1200 mm</text>
<text x="607" y="285" text-anchor="middle">400–500 mm</text>
<text x="397" y="478" text-anchor="middle">1600–1700 mm (Vorderkante durchgehend)</text>
<text x="57" y="160" text-anchor="middle" transform="rotate(-90 57 160)">500</text>
<text x="748" y="125" text-anchor="middle" transform="rotate(-90 748 125)">700</text>
<text x="770" y="40" text-anchor="middle" transform="rotate(-90 770 40)">200</text>
</g>
<text x="450" y="395" font-family="Arial,sans-serif" font-size="12" fill="#b7472a" text-anchor="middle">Vorderkante (Raumseite, durchgehend gerade)</text>
</svg>
