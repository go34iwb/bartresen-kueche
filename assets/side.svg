<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-label="Seitenansicht: Arbeitsplattenhöhe 1060, Tiefensprung 500 auf 700, Regalbrett 180 tief auf Stelzen">
<defs>
<marker id="a3" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M6 0 0 3 6 6z" fill="#3d4b4c"/></marker>
<pattern id="wh3" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e8e4d5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b8b4a5" stroke-width="1"/></pattern>
</defs>
<!-- Boden -->
<line x1="20" y1="468" x2="660" y2="468" stroke="#3d4b4c" stroke-width="2"/>
<!-- Wand (links, hinter 500er-Sektion) -->
<rect x="100" y="60" width="175" height="408" fill="url(#wh3)" stroke="none"/>
<!-- Schubladenkorpus (500 tief) -->
<rect x="100" y="128" width="175" height="340" fill="#d9c8a4" stroke="#71421f" stroke-width="1.5"/>
<!-- Stütze in Barzone -->
<rect x="350" y="128" width="9" height="340" fill="#6b7d80" stroke="#344244"/>
<!-- Arbeitsplatte 500-Abschnitt -->
<rect x="90" y="114" width="185" height="14" fill="#a96f3e" stroke="#71421f" stroke-width="1.5"/>
<!-- Arbeitsplatte 700-Abschnitt (rückseitig 70mm länger wegen Rücksprung) -->
<rect x="275" y="44" width="245" height="14" fill="#a96f3e" stroke="#71421f" stroke-width="1.5"/>
<rect x="275" y="58" width="245" height="70" fill="#a96f3e" opacity="0.25" stroke="#71421f" stroke-dasharray="3 3"/>
<text x="400" y="30" font-family="Arial,sans-serif" font-size="11" fill="#b7472a" text-anchor="middle">Rücksprung +200</text>
<!-- Risern für Regal -->
<line x1="120" y1="114" x2="120" y2="102" stroke="#71421f" stroke-width="1.5"/>
<line x1="255" y1="114" x2="255" y2="102" stroke="#71421f" stroke-width="1.5"/>
<!-- Regalbrett 180 tief -->
<rect x="100" y="94" width="63" height="8" fill="#a96f3e" stroke="#71421f" stroke-width="1.2"/>
<rect x="100" y="-6" width="63" height="8" fill="#a96f3e" stroke="#71421f" stroke-width="1.2"/>
<line x1="105" y1="94" x2="105" y2="2" stroke="#71421f" stroke-width="1"/>
<line x1="158" y1="94" x2="158" y2="2" stroke="#71421f" stroke-width="1"/>
<!-- Hocker (760 Sitzhöhe -> 468-266=202) -->
<g stroke="#5a696d" stroke-width="1.2" fill="#829296">
<rect x="380" y="202" width="60" height="10"/>
<line x1="388" y1="212" x2="382" y2="468"/>
<line x1="432" y1="212" x2="438" y2="468"/>
</g>
<rect x="378" y="194" width="64" height="8" fill="#a96f3e" stroke="#71421f"/>
<!-- Massketten -->
<g stroke="#3d4b4c" fill="none" stroke-width="1" marker-start="url(#a3)" marker-end="url(#a3)">
<line x1="60" y1="114" x2="60" y2="468"/>
<line x1="555" y1="44" x2="555" y2="202"/>
<line x1="600" y1="468" x2="600" y2="202"/>
<line x1="100" y1="500" x2="275" y2="500"/>
<line x1="275" y1="530" x2="520" y2="530"/>
<line x1="200" y1="94" x2="200" y2="114"/>
<line x1="230" y1="-6" x2="230" y2="94"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#172126">
<text x="40" y="291" text-anchor="middle" transform="rotate(-90 40 291)">1060</text>
<text x="572" y="125" text-anchor="middle" transform="rotate(-90 572 125)">1060</text>
<text x="618" y="335" text-anchor="middle" transform="rotate(-90 618 335)">760</text>
<text x="187" y="518" text-anchor="middle">500</text>
<text x="397" y="548" text-anchor="middle">700</text>
<text x="188" y="104" text-anchor="start">18 cm</text>
<text x="240" y="42" text-anchor="start" font-size="11">+100 / +50</text>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#5a696d">
<text x="187" y="310" text-anchor="middle">Schubladen</text>
<text x="410" y="300" text-anchor="middle">Hocker</text>
<text x="131" y="46" text-anchor="middle" font-size="10">Regal</text>
</g>
</svg>
